<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Ember &amp; Oak — Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirect 404s back to root index.html
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background:#111110;color:#C4BDB2;font-family:sans-serif;padding:2rem;text-align:center;">
    <p>Redirecting to Ember &amp; Oak...</p>
  </body>
</html>
